<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Valentín</title>
    <link rel="stylesheet" href="styles.css"> <!-- Assuming you have some styles -->
</head>
<body>
    <header>
        <h1>Feliz Día de San Valentín</h1>
    </header>
    
    <main>
        <section>
            <h2>Bienvenido a Nuestra Celebración</h2>
            <p>Disfruta de nuestras canciones y imágenes optimizadas para esta ocasión especial.</p>
        </section>

        <section>
            <h2>Música para el Corazón</h2>
            <audio controls>
                <source src="music/song.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </section>

        <section>
            <h2>Imágenes Optimizadas</h2>
            <img src="images/rose_optimized.jpg" alt="Rosa de San Valentín" loading="lazy">
            <img src="images/chocolate_optimized.jpg" alt="Chocolate para San Valentín" loading="lazy">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Celebración de San Valentín</p>
    </footer>
</body>
</html>
